/* Layout: colonna unica da telefono, scheda per pasto, barra di navigazione fissa in basso */
:root{
  --paper:#F2F6F4;
  --card:#FFFFFF;
  --ink:#16211E;
  --ink-2:#4B5955;
  --line:#D9E3DF;
  --accent:#1E6656;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2EEEA;
  --mod:#A8341F;
  --mod-bg:#FCE6E0;
  --gold:#8A6A1C;
  --gold-bg:#F7F0DC;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5;margin:0}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(110px + env(safe-area-inset-bottom,0px))}
.top{padding-right:60px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}

/* Intestazione */
.brand{font-size:.85rem;color:var(--ink-2);letter-spacing:.04em;margin:0 0 6px}
.top h1{font-size:2rem}
.top .plan{margin:4px 0 16px;color:var(--ink-2);font-size:1.05rem}
.kcal{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:999px;padding:2px 12px;font-size:.95rem;margin-left:4px;white-space:nowrap}
.weight{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.wgrid{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:10px}
.wcell{min-width:0}
.wlab{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2);margin-bottom:2px}
.wval{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.wval small{font-size:.9rem;font-weight:400;color:var(--ink-2)}
.winput{display:flex;align-items:center;gap:4px;border:2px solid var(--line);border-radius:10px;padding:2px 8px;background:var(--paper)}
.winput:focus-within{border-color:var(--accent)}
.winput input{width:100%;min-width:0;border:0;background:transparent;font:inherit;font-size:1.25rem;font-weight:700;padding:4px 0;color:var(--ink);font-variant-numeric:tabular-nums}
.winput input:focus{outline:none}
.winput span{color:var(--ink-2);font-size:.9rem}
.bar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .4s ease}
.wmsg{margin:0;font-size:1rem;color:var(--ink-2)}
.wmsg b{color:var(--accent)}

/* Selettore giorno */
.section-title{font-size:1.4rem;margin:28px 0 12px}
.days{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
/* Codice colore per giorno */
.app,.day{--day:var(--accent);--day-bg:var(--accent-soft)}
[data-day="g1"]{--day:#2B5BA6;--day-bg:#E3EBF8}
[data-day="g2"]{--day:#2D7A4C;--day-bg:#E1F1E7}
[data-day="g3"]{--day:#6A4AA2;--day-bg:#EEE8F8}
[data-day="detox"]{--day:#94650F;--day-bg:#F8EED6}
[data-day="libero"]{--day:#AD3F6C;--day-bg:#F9E3EC}
.day{grid-column:span 2;min-height:56px;border:2px solid var(--day-bg);background:var(--card);border-radius:12px;font-weight:700;font-size:1.05rem;cursor:pointer;padding:6px 4px;line-height:1.15;color:var(--day);position:relative}
.day::before{content:"";display:block;width:10px;height:10px;border-radius:50%;background:var(--day);margin:0 auto 4px}
.day.wide{grid-column:span 3}
.day small{display:block;font-weight:400;font-size:.8rem;color:var(--ink-2)}
.day[aria-pressed="true"]{background:var(--day);border-color:var(--day);color:#fff}
.day[aria-pressed="true"]::before{background:#fff}
.day[aria-pressed="true"] small{color:#fff;opacity:.9}
.day-note{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--day-bg);color:var(--ink);font-size:1rem}
.day-note b{color:var(--day)}
.legend{display:flex;align-items:center;gap:10px;margin:12px 0 0;font-size:.95rem;color:var(--ink-2)}

/* Pasti */
.meal-tools{display:flex;gap:8px;margin-top:16px}
.tool{flex:1;min-height:46px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;font-weight:700;font-size:.98rem;color:var(--ink-2);cursor:pointer}
.meals{display:grid;gap:14px;margin-top:12px}
.meal{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--day);border-radius:var(--r);box-shadow:0 1px 2px rgba(22,33,30,.04);overflow:hidden}
.meal-head{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;padding:14px 16px;min-height:68px}
.meal-head .mh-text{min-width:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.meal-head h2{font-size:1.55rem}
.dbadge{font-size:.85rem;font-weight:700;color:var(--day);background:var(--day-bg);border-radius:999px;padding:2px 10px;white-space:nowrap}
.when{font-size:.85rem;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:2px 10px;white-space:nowrap}
.mchev{width:40px;height:40px;border-radius:50%;background:var(--day-bg);color:var(--day);display:grid;place-items:center;transition:transform .2s ease}
.meal[open] .mchev{transform:rotate(180deg)}
.meal:not([open]) .meal-head{min-height:64px}
.meal-body{padding:0 16px 6px}
.lead{margin:0 0 12px;font-size:1.05rem}
.example{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:6px}
.ex-label{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);margin-bottom:2px}
.example p{margin:0;font-size:1.05rem}
.comp{border-top:1px solid var(--line);padding:14px 0}
.example + .comp,.lead + .comp{border-top:0}
.cat{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent);margin-bottom:2px}
.base{font-size:1.2rem;font-weight:700}
.sub{margin:8px 0 6px;font-size:.95rem;color:var(--ink-2)}

summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.alt-d{margin-top:10px}
.alt-d > summary{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 14px;border-radius:12px;background:var(--paper);border:1.5px solid var(--line);font-weight:700;color:var(--accent);font-size:1rem}
.alt-d .lbl{flex:1;min-width:0}
.alt-d .count{font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 9px;font-size:.9rem;color:var(--ink-2)}
.alt-d > summary svg{flex:none;transition:transform .2s ease}
.alt-d[open] > summary{border-bottom-left-radius:0;border-bottom-right-radius:0}
.alt-d[open] > summary svg{transform:rotate(180deg)}
.alt-d[open] .alts{border:1.5px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:4px 14px}

.alts{list-style:none;margin:0;padding:0}
.alts.open{margin-top:8px;border:1.5px solid var(--line);border-radius:12px;padding:4px 14px}
.alts li{display:grid;grid-template-columns:4.4em 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:1.02rem}
.alts li:last-child{border-bottom:0}
.alts li.noq{grid-template-columns:1fr}
.q{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.t{min-width:0}

mark.mod{background:var(--mod-bg);color:var(--mod);padding:0 .2em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--mod-bg);color:var(--mod);border-radius:999px;padding:5px 12px;font-size:.98rem}

/* Acqua */
.water{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-top:16px}
.water h2{font-size:1.35rem}
.water p{margin:4px 0 12px;color:var(--ink-2);font-size:1rem}
.glasses{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.glass{border:0;background:transparent;padding:4px 0;cursor:pointer;display:grid;justify-items:center;gap:2px;border-radius:10px}
.glass svg{width:100%;max-width:44px;height:auto}
.glass .fill{fill:transparent;transition:fill .2s}
.glass[aria-pressed="true"] .fill{fill:#7FB8D8}
.glass .outline{fill:none;stroke:var(--ink-2);stroke-width:2.2}
.glass span{font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.wtotal{margin-top:10px;font-weight:700;font-variant-numeric:tabular-nums}

/* Regole / Evitare */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px}
.stack{display:grid;gap:16px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:0}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:start}
.rules li:first-child{padding-top:0}
.rules li:last-child{border-bottom:0;padding-bottom:0}
.ico{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.ico.red{background:var(--mod-bg);color:var(--mod)}
.rules b{display:block;font-size:1.08rem}
.rules p{margin:2px 0 0;color:var(--ink-2);font-size:1rem}
.card h2{font-size:1.35rem;margin-bottom:10px}
.week{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.week li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.tag{font-weight:700;font-size:.92rem;padding:4px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.tag.gold{background:var(--gold-bg);color:var(--gold)}
.avoid-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.avoid-list li{background:var(--mod-bg);color:var(--mod);border-radius:10px;padding:10px 12px;font-size:1.02rem;font-weight:700;min-width:0}
.note{margin:12px 0 0;color:var(--ink-2);font-size:1rem}

/* Contatto */
.contact{margin-top:28px;padding:16px;border-radius:var(--r);border:1px dashed var(--line);font-size:1rem;color:var(--ink-2)}
.contact b{color:var(--ink)}
.phone{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px}
.phone a{font-size:1.2rem;font-weight:700;color:var(--accent);text-decoration:none;font-variant-numeric:tabular-nums;user-select:all}
.copy{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;cursor:pointer;font-size:.95rem;min-height:40px}

/* Barra in basso */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;box-shadow:0 -4px 16px rgba(22,33,30,.06)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;border-radius:12px;min-height:60px;display:grid;justify-items:center;align-content:center;gap:2px;cursor:pointer;font-size:.95rem;color:var(--ink-2);font-weight:700}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}

/* Pulsante chiudi */
.closebtn{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:20;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(22,33,30,.12)}
.closebtn svg{width:24px;height:24px}
.iosbar{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;max-width:536px;margin:0 auto;background:var(--card);border:1.5px solid var(--accent);border-radius:16px;padding:14px 48px 14px 16px;box-shadow:0 8px 28px rgba(22,33,30,.18);font-size:1rem;line-height:1.45}
.iosbar b{color:var(--accent)}
.iosbar .share{display:inline-block;vertical-align:-4px;width:20px;height:20px;color:var(--accent)}
.iosbar button{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;border-radius:50%;background:var(--paper);font-size:1.2rem;cursor:pointer;color:var(--ink-2)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin:0 auto;background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;font-size:1rem;text-align:center}
@media (max-width:380px){
  body{font-size:17px}
  .wgrid{grid-template-columns:1fr 1fr}
  .wcell.input{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.lock-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;display:grid;gap:16px;text-align:center;box-shadow:0 8px 30px rgba(22,33,30,.08)}
.lock-card img{width:72px;height:72px;border-radius:18px;margin:0 auto}
.lock-card h1{font-size:1.7rem}
.lock-card p{margin:0;color:var(--ink-2);font-size:1.05rem}
.pin{font:inherit;font-size:1.3rem;letter-spacing:.06em;text-align:center;padding:14px 8px;border:2px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);width:100%;font-variant-numeric:tabular-nums}
.pin:focus{outline:none;border-color:var(--accent)}
.unlock{font:inherit;font-weight:700;font-size:1.15rem;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.unlock:disabled{opacity:.6}
.lock-err{color:var(--mod);font-weight:700;min-height:1.5em}
</style></head>
<body>
<div class="lock" id="lock" hidden>
  <form class="lock-card" id="lockForm" autocomplete="off">
    <img src="apple-touch-icon.png" alt="">
    <h1>La mia dieta</h1>
    <p>Inserisci la password per aprire il tuo piano. La chiede solo la prima volta.</p>
    <label for="pin" class="sr" hidden>Password</label>
    <input class="pin" id="pin" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx-xxxx" required>
    <button class="unlock" id="unlockBtn" type="submit">Apri</button>
    <div class="lock-err" id="lockErr" role="alert"></div>
  </form>
</div>

  function decrypt(pin){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){
      return crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.c));
    }).then(function(buf){return new TextDecoder().decode(buf)});
  }
  function mount(html){
    document.body.innerHTML=html;
    [].slice.call(document.body.querySelectorAll('script')).forEach(function(old){
      var s=document.createElement('script');s.textContent=old.textContent;old.parentNode.replaceChild(s,old);
    });
  }
  function norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
  try{localStorage.removeItem('rc_pin')}catch(e){}
  function save(pin){try{localStorage.setItem('rc_key',pin)}catch(e){}}
  function saved(){try{return localStorage.getItem('rc_key')}catch(e){return null}}
  var lock=document.getElementById('lock'),form=document.getElementById('lockForm'),inp=document.getElementById('pin'),btn=document.getElementById('unlockBtn'),err=document.getElementById('lockErr');
  function showLock(){lock.hidden=false;setTimeout(function(){inp.focus()},100)}
  form.addEventListener('submit',function(e){
    e.preventDefault();var pin=norm(inp.value);if(!pin)return;
    btn.disabled=true;btn.textContent='Apro…';err.textContent='';
    decrypt(pin).then(function(html){save(pin);mount(html)}).catch(function(){
      btn.disabled=false;btn.textContent='Apri';err.textContent='Password sbagliata, controlla e riprova.';inp.value='';inp.focus();
    });
  });
  var p=saved();
  if(p){decrypt(p).then(mount).catch(function(){try{localStorage.removeItem('rc_key')}catch(e){}showLock()})}
  else showLock();
})();
</script>
</body>
</html>
